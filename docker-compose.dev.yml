version: '3.9'

services:
  # ============================================
  # SaaS Manager API
  # ============================================
  manager:
    build:
      context: .
      dockerfile: apps/manager/Dockerfile
    container_name: manager
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@saas-db:5432/apex_saas
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key
    depends_on:
      saas-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ============================================
  # SaaS Database (Prisma) - Manager API
  # ============================================
  saas-db:
    image: postgres:15-alpine
    container_name: apex-saas-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apex_saas
    volumes:
      - saas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Vendure Database - E-commerce Engine
  # ============================================
  vendure-db:
    image: postgres:15-alpine
    container_name: apex-vendure-db
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vendure
    volumes:
      - vendure_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis - Sessions & Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: apex-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saas_db_data:
  vendure_db_data:
  redis_data:
